[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-extstats-benchmarks"
version = "0.1.0"
description = "External benchmark ETL and lifecycle execution infrastructure"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "psycopg[binary]>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pgextbench = "pgextstats_benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
